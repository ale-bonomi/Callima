[project]
name = "crate"
version = "0.0.1"
description = "Ableton-first audio sample organizer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "pyyaml>=6",
  "send2trash>=1.8",
]

[project.scripts]
crate = "crate.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-Send2Trash"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/crate"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
